<!DOCTYPE html>
<html lang="id">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	<link rel="manifest" href="/manifest.json" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="default" />
	<meta name="apple-mobile-web-app-title" content="MAZEEDA" />
	<link rel="apple-touch-icon" href="/logo.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

	<!-- SEO Meta Tags -->
	<title>MAZEEDA - Aplikasi Manajemen & Informasi Komunitas</title>
	<meta name="description"
		content="MAZEEDA adalah web aplikasi manajemen modern untuk komunitas, dilengkapi Al-Qur'an digital, rekapitulasi keuangan Sangu, informasi mading realtime, dan galeri kenangan." />
	<meta name="theme-color" content="#2563EB" />

	<!-- Google Fonts for typography -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Amiri:wght@400;700&family=Amiri+Quran&family=Scheherazade+New:wght@400;700&display=swap"
		rel="stylesheet">

	<!-- Hide scrollbar globally for native app feel -->
	<style>
		::-webkit-scrollbar {
			display: none;
		}
		* {
			-ms-overflow-style: none;
			scrollbar-width: none;
		}
	</style>

	<!-- DotLottie Player -->
	<script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>

	%sveltekit.head%
</head>

<body class="bg-white text-slate-800 antialiased font-sans overflow-x-hidden" style="background-color: #FFFFFF;">
	<div style="display: contents" id="svelte-root-container">%sveltekit.body%</div>
</body>

</html>
